name: ehackyeah2026-app

# api, web, notify, and gemini run published images, the database lives in a separate Compose project
services:
  api:
    image: ghcr.io/portugalskie-armatki-sniezne/ehackyeah2026-api:${API_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # report photos, the image creates this directory for its unprivileged user
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # keeps photos across deployments, the first mount copies the directory owner from the image
      - api_uploads:/app/uploads
    networks:
      - db
      - default

  notify:
    image: ghcr.io/portugalskie-armatki-sniezne/ehackyeah2026-notify:${NOTIFY_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      UVICORN_PORT: "${NOTIFY_PORT:-8000}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_MOCK: "${SMTP_MOCK:-false}"
      SMTP_MOCK_DESTINATION: ${SMTP_MOCK_DESTINATION:-}
      UPLOAD_DIR: /app/uploads
    expose:
      - "${NOTIFY_PORT:-8000}"
    volumes:
      - api_uploads:/app/uploads:ro

  gemini:
    image: ghcr.io/portugalskie-armatki-sniezne/ehackyeah2026-gemini:${GEMINI_IMAGE_TAG:-dev}
    restart: unless-stopped
    user: "${GEMINI_UID:-65534}:${GEMINI_GID:-65534}"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gemini-service-account.json
      UPLOAD_DIR: /app/uploads
    expose:
      - "8000"
    volumes:
      - api_uploads:/app/uploads:ro
      - type: bind
        source: ${GEMINI_CREDENTIALS_FILE:-./project-key.json}
        target: /run/secrets/gemini-service-account.json
        read_only: true

  web:
    image: ghcr.io/portugalskie-armatki-sniezne/ehackyeah2026-web:${WEB_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  api_uploads:

networks:
  # the network of the database Compose project, where the api reaches POSTGRES_HOST
  db:
    name: ${DB_NETWORK:-ehackyeah2026_default}
    external: true
