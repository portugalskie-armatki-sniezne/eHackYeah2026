[project]
name = "ehackyeah-gemini"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.142.2",
    "google-genai==2.28.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
