[project]
name = "ehackyeah-api"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "psycopg[binary,pool]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, and bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# tests import their shared helpers from conftest
known-first-party = ["conftest"]
