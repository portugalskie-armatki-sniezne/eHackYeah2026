version: "3"

tasks:
  # the pre-commit hook lints the workspaces with staged changes
  # every task that sets up or starts the project enables it, so nobody has to remember to
  hooks:
    internal: true
    silent: true
    cmds:
      - cmd: git config core.hooksPath .githooks
        # a copy of the project without Git has no hooks to enable
        ignore_error: true

  setup:
    desc: Install dependencies, download inference models, enable Git hooks, and create missing .env
    deps: [hooks]
    cmds:
      - bun install
      - uv sync --directory apps/api --extra inference
      - uv run --directory apps/api --extra inference python -m app.inference.download
      - cmd: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Created .env from .env.example. Review its values before starting the API."
          fi

  web:
    desc: Start the frontend
    deps: [hooks]
    dir: apps/web
    dotenv: ["../../.env"]
    cmds:
      - bun run --no-orphans dev

  db:
    desc: Start the database, apply migrations, and wait for seed import
    deps: [hooks]
    preconditions:
      - sh: docker compose version
        msg: Install Docker with Compose and start Docker before running the database.
    cmds:
      - docker compose up -d db-seeder
      - docker compose wait db-seeder

  api:
    desc: Start the database and seed services, then start the API
    deps: [hooks]
    dir: apps/api
    dotenv: ["../../.env"]
    preconditions:
      - sh: test -f ../../.env
        msg: Run `task setup` to create .env first.
    cmds:
      - task: db
      - uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --reload --reload-dir app

  fe:lint:
    desc: Check the frontend with ESLint and Prettier
    dir: apps/web
    cmds:
      - bun run lint
      - bun run format:check

  fe:lint:fix:
    desc: Fix the frontend with ESLint and Prettier
    dir: apps/web
    cmds:
      # formatting runs last, even when problems that need a manual fix remain
      - defer: bun run format
      - bun run lint --fix

  be:lint:
    desc: Check the API with Ruff
    dir: apps/api
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  be:lint:fix:
    desc: Fix the API with Ruff
    dir: apps/api
    cmds:
      # formatting runs last, even when problems that need a manual fix remain
      - defer: uv run ruff format .
      - uv run ruff check --fix .
