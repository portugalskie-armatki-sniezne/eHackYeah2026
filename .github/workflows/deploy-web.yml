name: "[1] Deploy web"

# builds and deploys only the frontend
# a merge to main that changes it deploys dev, a manual run deploys the chosen environment
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/deploy-web.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options:
          - dev
          - prod
        default: dev

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE: ghcr.io/${{ github.repository_owner }}/ehackyeah2026-web

jobs:
  build:
    name: Build & push web
    runs-on: ubuntu-latest
    # provides the VITE_API_URL variable of the target environment
    # pushes to main have no inputs, so the environment falls back to dev
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.environment || 'dev' }}
            type=sha,format=long,prefix=${{ inputs.environment || 'dev' }}-

      - name: Build & push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          # the build context is the repository root because bun.lock covers all workspaces
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy web on ${{ inputs.environment || 'dev' }}
    needs: build
    # the self-hosted runner works on the target machine, so no inbound connection is needed
    runs-on: [self-hosted, "${{ inputs.environment || 'dev' }}"]
    environment: ${{ inputs.environment || 'dev' }}
    # do not let deployments overlap
    concurrency:
      group: deploy-web-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    steps:
      - name: Pull & restart containers
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
