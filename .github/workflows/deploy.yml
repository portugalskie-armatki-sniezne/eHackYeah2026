name: "[1] Deploy"

# builds and deploys the application images
# a merge to main deploys the changed services to dev, a manual run deploys the chosen service or all of them to the chosen environment
# every deployment copies docker-compose.app.yaml to the target machine
# every api deployment applies the database migrations first
# the release workflow calls it to deploy all services to prod
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - apps/notify/**
      - apps/gemini/**
      - db/migrations/**
      - package.json
      - bun.lock
      - .dockerignore
      - docker-compose.app.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy, or all for every service"
        type: choice
        options:
          - all
          - web
          - api
          - notify
          - gemini
        default: web
      environment:
        description: "Environment to deploy"
        type: choice
        options:
          - dev
          - prod
        default: dev
  workflow_call:
    inputs:
      service:
        description: "Service to deploy, or all for every service"
        type: string
        required: true
      environment:
        description: "Environment to deploy"
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ehackyeah2026

jobs:
  select:
    name: Select services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # the full history is needed to compare a push with the previous commit on main
          fetch-depth: 0

      - name: Select services
        id: select
        env:
          SERVICE: ${{ inputs.service }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$SERVICE" = all ]; then
            services='"web","api","notify","gemini"'
          elif [ -n "$SERVICE" ]; then
            services="\"$SERVICE\""
          else
            # the compose file and this workflow affect all services
            shared='docker-compose\.app\.yaml$|\.github/workflows/deploy\.yml$'
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            services=""
            if echo "$changed" | grep -qE "^(apps/web/|package\.json$|bun\.lock$|\.dockerignore$|$shared)"; then
              services='"web"'
            fi
            # migrations are applied when api is deployed
            if echo "$changed" | grep -qE "^(apps/api/|db/migrations/|\.dockerignore$|$shared)"; then
              services="${services:+$services,}\"api\""
            fi
            if echo "$changed" | grep -qE "^(apps/notify/|\.dockerignore$|$shared)"; then
              services="${services:+$services,}\"notify\""
            fi
            if echo "$changed" | grep -qE "^(apps/gemini/|\.dockerignore$|$shared)"; then
              services="${services:+$services,}\"gemini\""
            fi
          fi
          echo "services=[$services]" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.service }}
    needs: select
    if: ${{ needs.select.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    # provides the VITE_API_URL and VITE_GOOGLE_CLIENT_ID variables of the target environment
    # pushes to main have no inputs, so the environment falls back to dev
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.environment || 'dev' }}
            type=sha,format=long,prefix=${{ inputs.environment || 'dev' }}-

      - name: Build & push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          # both Dockerfiles use the repository root as the build context
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the api image has no such ARGs, so Docker ignores them there
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy on ${{ inputs.environment || 'dev' }}
    needs: [select, build]
    # the self-hosted runner works on the target machine, so no inbound connection is needed
    runs-on: [self-hosted]
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: read
    # do not let deployments overlap
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      # holds the secrets and image tags of the target environment
      ENV_FILE: ${{ vars.DEPLOY_DIR }}/.env
      IMAGE_TAG: ${{ inputs.environment || 'dev' }}-${{ github.sha }}
      SERVICES: ${{ join(fromJSON(needs.select.outputs.services), ' ') }}
    steps:
      # the Compose file and the migrations of the deployed commit come from this checkout
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # the copy on the target machine follows the deployed commit, so it needs no manual updates
      - name: Update Compose file
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: cp docker-compose.app.yaml "$DEPLOY_DIR/docker-compose.yml"

      - name: Select image tags
        run: |
          for service in $SERVICES; do
            # web uses WEB_IMAGE_TAG, api uses API_IMAGE_TAG
            variable="$(echo "$service" | tr '[:lower:]' '[:upper:]')_IMAGE_TAG"
            if grep -q "^$variable=" "$ENV_FILE"; then
              sed -i "s|^$variable=.*|$variable=$IMAGE_TAG|" "$ENV_FILE"
            else
              echo "$variable=$IMAGE_TAG" >> "$ENV_FILE"
            fi
          done

      # the images are private, so the machine needs a token to pull them
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        # the Compose file and .env of the environment live in this directory on the target machine
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          # SERVICES is unquoted on purpose so that each service is a separate argument
          docker compose pull $SERVICES

      # runs after the pull, so that the old api works on the new schema only for the time of the restart
      - name: Apply database migrations
        if: ${{ contains(fromJSON(needs.select.outputs.services), 'api') }}
        run: |
          # the database settings of the environment, with the same defaults as in docker-compose.app.yaml
          set -a
          . "$ENV_FILE"
          set +a
          export DATABASE_URL="postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-local_dev_password}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-app_db}?sslmode=disable"
          # the same dbmate version and settings as the db-migrator service in docker-compose.yaml
          # DATABASE_URL is passed by name to keep the password out of the command line
          docker run --rm \
            --network "${DB_NETWORK:-ehackyeah2026_default}" \
            -e DATABASE_URL \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations \
            -e DBMATE_NO_DUMP_SCHEMA=true \
            -e DBMATE_STRICT=true \
            -v "$GITHUB_WORKSPACE/db/migrations:/db/migrations:ro" \
            amacneil/dbmate:2.34.1 --wait up

      - name: Restart services
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          docker compose up -d --wait --wait-timeout 600 $SERVICES
          # -a also drops the tagged images of earlier deployments, which otherwise fill the disk
          docker image prune -a -f
